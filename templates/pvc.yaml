{{- if and .Values.app.persistence .Values.app.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gwapp.fullname" . }}-storage
  namespace: {{ include "gwapp.namespace" . }}
  labels:
    {{- include "gwapp.labels" . | nindent 4 }}
  {{- with .Values.app.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- range .Values.app.persistence.accessModes }}
    - {{ . }}
    {{- end }}
  {{- if .Values.app.persistence.storageClassName }}
  storageClassName: {{ .Values.app.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.app.persistence.size | default "5Gi" }}
{{- end }}
